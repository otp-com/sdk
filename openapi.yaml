openapi: 3.0.0
paths:
  /api/v1/otp/send:
    post:
      description: 'Routing picks the channel from the app config. The response tells you how this OTP completes. completion "code": the code was delivered (SMS, email, Telegram, or WhatsApp under the template mode), the user enters it and you call POST /otp/verify. On WhatsApp in a link mode the code is not sent yet: action_url is a wa.me link the user opens to send us a prefilled message; under completion "code" we reply to that message with the code, under completion "inbound" the message itself approves the OTP, there is no code, and you learn the outcome by polling GET /otp/:id or from the otp.approved webhook. Which WhatsApp mode applies is configured per account. Sandbox OTPs always complete with "code": on WhatsApp they still return a sample action_url so you can see the shape, but nothing inbound happens; verify with the sandbox code. Outside sandbox, action_url is null whenever no link is involved.'
      operationId: sendOtp
      parameters:
        - name: idempotency-key
          required: false
          in: header
          description: Replay the prior response for a repeated request; a reused key with a different body is a 409.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendRequest'
      responses:
        '201':
          description: OTP created and delivery started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResponse'
        '401':
          description: Missing or invalid API key (also returned for a disabled app or a suspended company).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: No channel can reach this recipient, or the idempotency key was reused with a different body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Either routing picked WhatsApp and no active WhatsApp sender is configured (link modes), or the active sender has no approved template (template mode), or the platform is closed for maintenance (see the Retry-After header).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: 'Start an OTP: routes a channel and dispatches the code.'
      tags:
        - OTP
  /api/v1/otp/verify:
    post:
      description: 'matched is true only on the correct code. An OTP with completion "inbound" has no code: while it is pending a verify call never matches and spends an attempt (enough wrong calls fail it); once the inbound message has approved it, any verify call simply reports the approved OTP. Wait for the approval instead.'
      operationId: verifyOtp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '401':
          description: Missing or invalid API key (also returned for a disabled app or a suspended company).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'OTP not found (the same 404 is returned for an OTP belonging to another company, or to the other environment: a test key addresses only sandbox OTPs and a live key only live ones).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The platform is closed for maintenance. Retry after the interval in the Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Verify a code against a pending OTP.
      tags:
        - OTP
  /api/v1/otp/resend:
    post:
      description: 'Moves the OTP to the next channel of your routing order, to the channel you name, or repeats the last one once the order is exhausted, and dispatches again; the response has the same shape as send. completion follows the channel: leaving WhatsApp for a code channel sets it back to "code"; landing on WhatsApp in a link mode returns an action_url, and an OTP already in a link mode gets the same link back.'
      operationId: resendOtp
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendRequest'
      responses:
        '200':
          description: Resend accepted; the OTP may now be on a different channel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpResponse'
        '401':
          description: Missing or invalid API key (also returned for a disabled app or a suspended company).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'OTP not found (the same 404 is returned for an OTP belonging to another company, or to the other environment: a test key addresses only sandbox OTPs and a live key only live ones).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The OTP cannot be resent (resolved, expired, or out of attempts), or the requested channel is not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Resend cooldown has not elapsed; see the Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Either routing picked WhatsApp and no active WhatsApp sender is configured (link modes), or the active sender has no approved template (template mode), or the platform is closed for maintenance (see the Retry-After header).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Resend a pending OTP, escalating the channel if configured.
      tags:
        - OTP
  /api/v1/otp/{otp_id}:
    get:
      description: 'status is one of pending, approved, failed, expired. Under completion "inbound" this is how you learn the approval without the webhook: poll it every 3 to 5 seconds until status leaves pending.'
      operationId: getOtpStatus
      parameters:
        - name: otp_id
          required: true
          in: path
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: Current status of the OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpStatusResponse'
        '400':
          description: otp_id is not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid API key (also returned for a disabled app or a suspended company).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'OTP not found (the same 404 is returned for an OTP belonging to another company, or to the other environment: a test key addresses only sandbox OTPs and a live key only live ones).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The platform is closed for maintenance. Retry after the interval in the Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Fetch the current status of an OTP.
      tags:
        - OTP
  /api/v1/verifications/exchange:
    post:
      description: 'Call this from YOUR backend, with a server key from your API Keys page, using the verification_token your app received from POST /client/otp/verify. It returns the recipient that was actually verified. This is the only trustworthy answer to "did this user prove they control this number": the `matched` field the device saw is a UI hint, read off a device you do not control, and an app can claim anything. Exchanging is idempotent for the same API key within the token lifetime, so a retry after a network failure returns the same result instead of losing the verification. Any other key, a second use, or an expired token gets a 404.'
      operationId: exchangeVerification
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationExchangeRequest'
      responses:
        '200':
          description: The verification this token proves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationExchangeResponse'
        '401':
          description: Missing or invalid API key (also returned for a publishable key used here, a disabled app, or a suspended company).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Verification token not found, expired, or already exchanged. The same 404 covers a token that is not yours and one already exchanged by a different key of your own, so the endpoint cannot be used to probe which tokens exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request body failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The platform is closed for maintenance. Retry after the interval in the Retry-After header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      summary: Exchange a verification token for the recipient it proves.
      tags:
        - Verifications
info:
  title: otp OTP API
  description: |-
    Public API for sending and verifying one-time passwords. Authenticate every request with your API key
    as a Bearer token. The delivery channel is chosen by your account routing; you only pass the
    recipient. The code itself is never returned by the API.

    Errors are always `{"error": {"type", "message", "details"?}}`.

    Every send, resend and status response carries `completion`. `code` means the user enters a code and
    you call verify. Every non-WhatsApp channel and WhatsApp under the template mode deliver it directly;
    WhatsApp under code-back instead returns an `action_url` (a wa.me link) the user opens to send us a
    prefilled message, and we reply with the code. `inbound` means that prefilled message itself approves the OTP: there is no code,
    and you learn the outcome by polling `GET /otp/:id` or from the `otp.approved` webhook. Which WhatsApp
    mode applies is configured per account.

    If your app uses one of the mobile SDKs, the device verifies against the client API and receives a
    `verification_token` instead of a result. Exchange that token here, with your server key
    (`POST /verifications/exchange`), to learn which recipient was verified. What an app tells your
    backend about its own verification is unverifiable, so the token is the whole security model.
  version: 1.0.0
  contact: {}
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
tags:
  - name: OTP
    description: Send, verify, resend, and check one-time passwords.
  - name: Verifications
    description: Exchange a token from the mobile SDKs for the recipient it proves.
servers:
  - url: https://api.otp.com
    description: Production
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Your API key (`otp_live_…` for production, `otp_test_…` for sandbox).
  schemas:
    ErrorBody:
      type: object
      properties:
        type:
          type: string
          description: Machine-readable error class, e.g. "OtpNotFoundError".
          example: OtpNotFoundError
        message:
          type: string
          description: Human-readable message. Safe to log; never contains the OTP code.
        details:
          type: object
          additionalProperties: true
          description: Structured context, present on validation errors ({loc, msg, type} per field) and a few domain errors.
      required:
        - type
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      required:
        - error
    SendRequest:
      type: object
      properties:
        recipient:
          type: string
          description: Phone number (E.164) or email address to deliver the OTP to.
          example: '+14155552671'
          minLength: 1
          maxLength: 320
        locale:
          type: string
          nullable: true
          description: BCP-47 locale for the message template; falls back to the app default.
          example: en
          maxLength: 10
        client_ip:
          type: string
          nullable: true
          description: 'IP address of the end user who triggered this OTP (IPv4 or IPv6). Strongly recommended: requests without it share a much tighter per-app rate limit, and it feeds abuse protection for your own traffic. Private/reserved addresses count as absent.'
          example: 81.2.69.142
      required:
        - recipient
    Status:
      type: string
      enum:
        - pending
        - approved
        - failed
        - expired
    Channel:
      type: string
      enum:
        - sms
        - whatsapp
        - email
        - telegram
      description: Channel the OTP was dispatched on; null until routed.
    Completion:
      type: string
      enum:
        - code
        - inbound
      description: 'How this OTP completes. "code": the user enters the code and you call POST /otp/verify. "inbound": the user opens action_url and sends the prefilled WhatsApp message; that message approves the OTP, no code is sent. Poll GET /otp/:id or take the otp.approved webhook.'
    OtpResponse:
      type: object
      properties:
        otp_id:
          type: string
          format: uuid
        status:
          allOf:
            - $ref: '#/components/schemas/Status'
        channel:
          nullable: true
          description: Channel the OTP was dispatched on; null until routed.
          allOf:
            - $ref: '#/components/schemas/Channel'
        masked_recipient:
          type: string
          description: Recipient with the middle digits masked.
          example: +14****71
        action_url:
          type: string
          nullable: true
          description: 'WhatsApp link the user opens: they send us the prefilled message and we reply with the code over WhatsApp (completion "code") or approve the OTP on that message (completion "inbound"). Present only when dispatched on the whatsapp channel; null otherwise. Null under the template mode, where the code is pushed directly and the flow is the same as SMS.'
          example: https://wa.me/13845555555?text=Verify%20me%3A%20aB3xZ-9kQ2m-7pLw4-2mN8k
        completion:
          description: 'How this OTP completes. "code": the user enters the code and you call POST /otp/verify. "inbound": the user opens action_url and sends the prefilled WhatsApp message; that message approves the OTP, no code is sent. Poll GET /otp/:id or take the otp.approved webhook.'
          allOf:
            - $ref: '#/components/schemas/Completion'
      required:
        - otp_id
        - status
        - channel
        - masked_recipient
        - completion
    VerifyRequest:
      type: object
      properties:
        otp_id:
          type: string
          format: uuid
          description: The OTP id returned by send/resend.
        code:
          type: string
          description: The code the recipient entered.
          example: '123456'
          minLength: 1
          maxLength: 16
      required:
        - otp_id
        - code
    VerifyResponse:
      type: object
      properties:
        otp_id:
          type: string
          format: uuid
        status:
          allOf:
            - $ref: '#/components/schemas/Status'
        matched:
          type: boolean
          description: Whether the submitted code matched.
      required:
        - otp_id
        - status
        - matched
    ResendRequest:
      type: object
      properties:
        otp_id:
          type: string
          format: uuid
          description: The OTP id to resend.
        channel:
          nullable: true
          description: Move this OTP onto a specific channel, e.g. "sms" when the recipient has no WhatsApp. The channel must be enabled for your app and the recipient. Omit to advance to the next channel in your routing order, or to repeat the last one once the order is exhausted.
          allOf:
            - $ref: '#/components/schemas/Channel'
      required:
        - otp_id
    OtpStatusResponse:
      type: object
      properties:
        otp_id:
          type: string
          format: uuid
        status:
          allOf:
            - $ref: '#/components/schemas/Status'
        masked_recipient:
          type: string
          description: Recipient with the middle digits masked.
          example: +14****71
        completion:
          description: 'How this OTP completes. "code": the user enters the code and you call POST /otp/verify. "inbound": the user opens action_url and sends the prefilled WhatsApp message; that message approves the OTP, no code is sent. Poll GET /otp/:id or take the otp.approved webhook.'
          allOf:
            - $ref: '#/components/schemas/Completion'
      required:
        - otp_id
        - status
        - masked_recipient
        - completion
    VerificationExchangeRequest:
      type: object
      properties:
        verification_token:
          type: string
          description: The verification_token your app received from POST /client/otp/verify.
          example: otp_vt_3xZ9kQ2m7pLw42mN8kaB3xZ9kQ2m7pLw
          minLength: 1
          maxLength: 128
      required:
        - verification_token
    RecipientType:
      type: string
      enum:
        - phone
        - email
    VerificationExchangeResponse:
      type: object
      properties:
        otp_id:
          type: string
          format: uuid
          description: The OTP this verification belongs to.
        recipient:
          type: string
          description: The recipient that was verified, in full. This is the answer the device could not be trusted to give you.
          example: '+14155552671'
        recipient_type:
          allOf:
            - $ref: '#/components/schemas/RecipientType'
        channel:
          nullable: true
          description: Channel the verified code was delivered on.
          allOf:
            - $ref: '#/components/schemas/Channel'
        verified_at:
          type: string
          format: date-time
          description: When the end user entered the correct code.
      required:
        - otp_id
        - recipient
        - recipient_type
        - channel
        - verified_at
