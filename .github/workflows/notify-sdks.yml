name: Notify SDKs on spec change

# "Poke" each language SDK repo so it regenerates itself from the current spec. Each sdk-* repo
# listens for the `spec-updated` repository_dispatch event (and also exposes a manual "Update from
# spec" run). Requires an org secret SDK_DISPATCH_TOKEN (a PAT or GitHub App token with
# `contents:write` + `actions:write` on the sdk-* repos).
#
# Manual only: a spec push does not fan out on its own. Run this workflow when the SDKs should
# follow, or regenerate locally with ../update-sdk.sh.
on:
  workflow_dispatch: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo: [sdk-node, sdk-php, sdk-go, sdk-python]
    steps:
      - name: Poke ${{ matrix.repo }}
        env:
          GH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN }}
        run: |
          gh api "repos/otp-com/${{ matrix.repo }}/dispatches" \
            -f event_type=spec-updated \
            -F "client_payload[sha]=${{ github.sha }}"
